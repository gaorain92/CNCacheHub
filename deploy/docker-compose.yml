# CNCacheHub 生产环境 docker-compose（HTTP 模板）
#
# 适用：公网 IP + 无域名场景
# 用法：  ADMIN_PASSWORD=xxx docker compose up -d --build
# 然后访问 http://your-server-ip/
#
# 加固说明（详见 docs/security.md）：
#   - cap_drop ALL + 最小 cap_add — 容器只能做必要操作
#   - no-new-privileges — 禁止 SUID/SGID 提权
#   - mem_limit / pids_limit — 防止 DoS 资源耗尽
#   - read_only + tmpfs — server/web 不可写 root fs
#   - 不用 host 网络 — 用 user-defined bridge 默认隔离

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: cncachehub-server
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - CNCH_DATA_DIR=/var/lib/cncachehub
      - CNCH_CACHE_DIR=/var/lib/cncachehub/cache
      - CNCH_LOG_DIR=/var/log/cncachehub
      - CNCH_HTTP_ADDR=:8080
      - CNCH_LOG_LEVEL=${CNCH_LOG_LEVEL:-info}
      - CNCH_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CNCH_SMALL_VPS_OPT=${SMALL_VPS_OPT:-true}
      - CNCH_RESERVE_SPACE_GB=${RESERVE_SPACE_GB:-5}
      - CNCH_MAX_OBJECT_SIZE_MB=${MAX_OBJECT_SIZE_MB:-1024}
      - CNCH_CACHE_TOTAL_GB=${CACHE_TOTAL_GB:-20}
      - TZ=${TZ:-UTC}
    volumes:
      - cncachehub_data:/var/lib/cncachehub
      - cncachehub_cache:/var/lib/cncachehub/cache
    # === SECURITY HARDENING ===
    read_only: true
    tmpfs:
      - /tmp:size=100M,mode=1777
      - /var/log:size=100M,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN          # SQLite WAL/SHM 文件管理
      - DAC_OVERRIDE   # 写 named volume（root in container）
      - FOWNER         # chown 缓存文件
      - SETUID
      - SETGID
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 200
    # 禁用新版 kernel features（避免兼容性问题）
    shm_size: 64m
    # 容器 ulimit
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: cncachehub-web
    restart: unless-stopped
    expose:
      - "80"
    # === SECURITY HARDENING ===
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=50M
      - /var/run:size=10M
      - /tmp:size=20M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 50
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: cncachehub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    # === SECURITY HARDENING ===
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE  # 绑 80/443
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 100
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  cncachehub_data:
  cncachehub_cache:
  caddy_data:
  caddy_config:

# === 全局网络 ===
# 默认用 user-defined bridge — 容器间可通信但与 host 隔离
networks:
  default:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_icc: "true"
      com.docker.network.bridge.enable_ip_masquerade: "true"
    # 想更严就只让 server/web/caddy 互相通，外部进不来 — 但要折腾 iptables
