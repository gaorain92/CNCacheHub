# CNCacheHub 生产环境 docker-compose
# 适用：公网 IP + 无域名场景（HTTP only，Caddy 不开 TLS）
#
# 用法：
#   ADMIN_PASSWORD=xxx docker compose up -d --build
#   然后访问 http://your-server-ip/
#
# 服务组件：
#   - server   Go 后端（API + 反代核心）
#   - web      Vue 3 控制台（静态构建产物）
#   - caddy    反向代理 + gzip + 安全头
#
# 数据卷：
#   - cncachehub_data  SQLite + 配置
#   - cncachehub_cache 缓存的 blob（大文件）

services:
  server:
    build:
      context: ../server
      dockerfile: Dockerfile
    container_name: cncachehub-server
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - CNCH_DATA_DIR=/var/lib/cncachehub
      - CNCH_CACHE_DIR=/var/lib/cncachehub/cache
      - CNCH_LOG_DIR=/var/log/cncachehub
      - CNCH_HTTP_ADDR=:8080
      - CNCH_LOG_LEVEL=${CNCH_LOG_LEVEL:-info}
      - CNCH_ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CNCH_SMALL_VPS_OPT=${SMALL_VPS_OPT:-true}
      - CNCH_RESERVE_SPACE_GB=${RESERVE_SPACE_GB:-5}
      - CNCH_MAX_OBJECT_SIZE_MB=${MAX_OBJECT_SIZE_MB:-1024}
      - CNCH_CACHE_TOTAL_GB=${CACHE_TOTAL_GB:-20}
      - TZ=${TZ:-UTC}
    volumes:
      - cncachehub_data:/var/lib/cncachehub
      - cncachehub_cache:/var/lib/cncachehub/cache
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: cncachehub-web
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    container_name: cncachehub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  cncachehub_data:
  cncachehub_cache:
  caddy_data:
